name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Decode certificate
        shell: pwsh
        run: |
          if ("$env:CERT_BASE64".Length -gt 0) {
            $bytes = [Convert]::FromBase64String("$env:CERT_BASE64")
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.p12", $bytes)
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=file://$env:RUNNER_TEMP\cert.p12"
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=$env:CERT_PASSWORD"
            Write-Output "Certificate decoded and configured"
          } else {
            Write-Output "No certificate secret set — building without signing"
          }
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Build & package installer
        run: npm run build && npx electron-builder --win --publish=never

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
