name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Decode certificate
        if: ${{ secrets.CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("$env:CERT_BASE64")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.p12", $bytes)
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}

      - name: Build & package installer
        run: npm run build && npx electron-builder --win --publish=never
        env:
          CSC_LINK: ${{ secrets.CERT_BASE64 != '' && format('file://{0}\cert.p12', runner.temp) || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
